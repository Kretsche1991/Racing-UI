name: Installer bauen
on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
permissions:
  contents: write
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: pip install pyirsdk websockets pyinstaller
      - run: pyinstaller --onefile --noconsole --name iracing_bridge --distpath bridge --workpath pyi-build --specpath pyi-build bridge/iracing_bridge.py
      - run: npm install
      - run: npm version 1.0.${{ github.run_number }} --no-git-tag-version
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
