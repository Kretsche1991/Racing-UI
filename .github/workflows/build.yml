yaml
name: Installer bauen
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: pip install pyirsdk websockets pyinstaller
      - run: pyinstaller --onefile --noconsole --name iracing_bridge --distpath bridge --workpath pyi-build --specpath pyi-build bridge/iracing_bridge.py
      - run: npm install
      - run: npm run dist
      - uses: actions/upload-artifact@v4
        with: { name: iRacingHUD-Setup, path: dist/*.exe }
