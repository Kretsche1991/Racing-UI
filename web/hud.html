<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>iRacing HUD</title>
<style>
html,body{margin:0;height:100%;overflow:hidden;background:#1a1f26;font-family:Inter,system-ui,sans-serif;color:#E8EAED;font-variant-numeric:tabular-nums}
body.overlay{background:transparent}
.p{position:absolute;background-color:rgba(var(--bg,10,12,16),var(--o,.8));background-image:var(--bi,none);border:1px solid rgba(var(--bd,255,255,255),calc(var(--o,.8)*var(--bda,.125)));border-radius:var(--rad,12px);color:var(--fg,#E8EAED);font-family:var(--ff,inherit);box-shadow:var(--sh,none);text-shadow:var(--ts,none);backdrop-filter:var(--bf,none);padding:14px 16px;box-sizing:border-box;transform-origin:top left;user-select:none;touch-action:none}
body.edit .p{cursor:move;outline:1px dashed rgba(255,255,255,.4)}
body.edit .p.sel{outline:2px solid var(--c)}
.l{font-size:12px;font-weight:600;letter-spacing:.12em;color:var(--mut,#9AA1AB);text-transform:uppercase;margin-bottom:6px}
.r{display:flex;gap:12px;padding:4px 8px;border-radius:6px;font-size:16px}
.r b{width:40px;font-weight:800}.r span{flex:1;font-weight:600}.r i{font-style:normal;color:var(--mut,#9AA1AB)}
.r.me{background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c)}.r.me i{color:var(--c)}
.led{display:flex;gap:4px;margin-bottom:10px}.led u{flex:1;height:18px;border-radius:3px}
.g3{display:flex;justify-content:space-between;align-items:flex-end}.g3>div{width:130px}
.g3 b{font-size:28px}.g3 .sp{font-size:50px;font-weight:800;line-height:1}.g3 small,.t small{font-size:13px;color:var(--mut,#9AA1AB);display:block}
.gear{font-size:110px;font-weight:800;line-height:.9;color:var(--c);text-align:center}
.delta{font-size:56px;font-weight:800;line-height:1.1;margin-bottom:6px}
.kv{display:flex;justify-content:space-between;font-size:18px;padding:3px 0}.kv span{color:var(--mut,#9AA1AB)}.kv b{font-weight:600}
.tg{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:10px}
.t{border:1px solid color-mix(in srgb,var(--fg,#E8EAED) 18%,transparent);border-radius:8px;padding:6px 10px;background:color-mix(in srgb,var(--fg,#E8EAED) 6%,transparent)}.t b{font-size:24px;display:block}
.fu{display:flex;justify-content:space-between;align-items:baseline;font-size:22px;font-weight:800}
#bar{position:fixed;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:10px;align-items:center;font-size:13px;opacity:.35;z-index:9;background:rgba(10,12,16,.8);padding:4px 10px;border-radius:20px}
#bar:hover,body.edit #bar{opacity:1}
button{font:inherit;color:#E8EAED;background:#2a313b;border:1px solid #444c57;border-radius:6px;padding:6px 10px;cursor:pointer}
#dr{position:fixed;right:12px;top:48px;width:250px;background:rgba(10,12,16,.95);border:1px solid #444c57;border-radius:12px;padding:14px;display:none;z-index:9;font-size:14px}
body.edit #dr{display:block}
#dr h2{font-size:16px;margin:0 0 10px}#dr label{display:flex;justify-content:space-between;align-items:center;margin:10px 0}
#dr input[type=range]{width:120px}#ctl{display:none}.hint{color:var(--mut,#9AA1AB);font-size:12px;margin:8px 0}
canvas{display:block;width:100%;height:90px;background:color-mix(in srgb,var(--fg,#E8EAED) 6%,transparent);border-radius:6px}
.bars{display:flex;gap:6px;height:60px;margin-top:8px}.bars i{flex:1;background:color-mix(in srgb,var(--fg,#E8EAED) 10%,transparent);border-radius:4px;position:relative;overflow:hidden}.bars u{position:absolute;left:0;right:0;bottom:0}
.fl{font-size:22px;font-weight:800;text-align:center;padding:10px;border-radius:8px;color:#000}
.gf{position:relative;width:170px;height:170px;margin:4px auto 8px;border-radius:50%;border:2px solid color-mix(in srgb,var(--fg,#E8EAED) 25%,transparent);background:radial-gradient(circle,transparent 48%,color-mix(in srgb,var(--fg,#E8EAED) 15%,transparent) 49%,transparent 51%)}.gf u{position:absolute;width:16px;height:16px;border-radius:50%;background:var(--c);margin:-8px;left:50%;top:50%}
.r em{font-style:normal;font-size:13px;color:var(--mut,#9AA1AB);margin-left:6px}
#mc{height:240px}
html:has(body.overlay){background:transparent}
body.overlay:not(.edit) #bar{display:none}
@keyframes bl{50%{opacity:.35}}.bl{animation:bl .5s infinite}
</style>
</head>
<body>
<div id="bar"><span id="st"></span><button id="eb" type="button">Bearbeiten (E)</button></div>
<aside id="dr">
<h2 id="dn">Panel anklicken</h2>
<div id="ctl">
<label>Größe <input type="range" id="sz" min="0.5" max="2" step="0.05" aria-label="Größe"></label>
<label>Transparenz <input type="range" id="op" min="0" max="1" step="0.05" aria-label="Transparenz"></label>
<label>Farbe <input type="color" id="co" aria-label="Farbe"></label>
<label>Sichtbar <input type="checkbox" id="vi"></label>
<button type="button" id="r1">Panel zurücksetzen</button>
</div>
<p class="hint">Panel anklicken und ziehen, um es zu verschieben.</p>
<label>Theme <select id="th"><option value="standard">Standard</option><option value="carbon">Carbon</option><option value="glas">Glas</option><option value="retro">Retro-Dash</option><option value="neon">Neon</option><option value="kontrast">Hochkontrast</option></select></label>
<label>Profil <select id="pf"><option>Practice</option><option>Qualify</option><option>Race</option></select></label>
<label>Auto je Session <input type="checkbox" id="au"></label>
<label>Einheiten <select id="un"><option value="m">Metrisch</option><option value="i">Imperial</option></select></label>
<label>Auto-Tanken (Boxeneingang) <input type="checkbox" id="af"></label>
<label>iRating zeigen <input type="checkbox" id="ir"></label>
<label>Karte spiegeln <input type="checkbox" id="mi"></label>
<button type="button" id="rm">Karte neu aufzeichnen</button>
<label>Transparent (Overlay) <input type="checkbox" id="ov"></label>
<button type="button" id="ra">Alles zurücksetzen</button>
</aside>
<div id="stage"></div>
<script>
const $=s=>document.querySelector(s),esc=s=>String(s).replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const G='#3DDC84',A='#FFB400',R='#FF4D4D';
const NAMES={stand:'Platzierung',rel:'Relative',flag:'Flaggen',gap:'Abstand',ovt:'Overtake-Alert',inp:'Pedale',map:'Streckenkarte',rpm:'Drehzahl · Gang · Speed',lap:'Rundenzeiten',fuel:'Fuel-Rechner',gf:'G-Kräfte',tires:'Reifen · Sprit'};
const W={stand:280,rel:280,flag:260,gap:260,ovt:340,inp:330,map:330,rpm:480,lap:310,fuel:300,gf:210,tires:310};
const DEF={stand:{x:2,y:3,s:1,c:A,v:1},rel:{x:78,y:3,s:1,c:A,v:1},flag:{x:40,y:3,s:1,c:A,v:1},gap:{x:40,y:12,s:1,c:A,v:1},ovt:{x:38,y:20,s:1,c:A,v:1},inp:{x:2,y:22,s:1,c:A,v:1},map:{x:2,y:45,s:1,c:A,v:1},rpm:{x:34,y:74,s:1,c:A,v:1},lap:{x:2,y:72,s:1,c:A,v:1},fuel:{x:78,y:24,s:1,c:A,v:1},gf:{x:80,y:42,s:1,c:A,v:1},tires:{x:76,y:64,s:1,c:A,v:1}};
let S;try{S=JSON.parse(localStorage.getItem('hudcfg2'))}catch{}
const mk=()=>structuredClone(DEF);
S=S||{units:'m',ir:1,auto:1,active:'Race',p:{Practice:mk(),Qualify:mk(),Race:mk()}};
for(const n in S.p)for(const k in DEF)S.p[n][k]=S.p[n][k]||mk()[k];
let cfg=S.p[S.active];
const mkv=(bg,fg,mut,bd,bda,rad,ff,sh,extra)=>Object.assign({'--bg':bg,'--fg':fg,'--mut':mut,'--bd':bd,'--bda':bda,'--rad':rad,'--ff':ff,'--sh':sh,'--bi':'none','--ts':'none','--bf':'none'},extra||{});
const THEMES={
 standard:{acc:'#FFB400',o:.8,mut:'#9AA1AB',line:'#5b6470',v:mkv('10,12,16','#E8EAED','#9AA1AB','255,255,255','.125','12px','inherit','none')},
 carbon:{acc:'#E10600',o:.88,mut:'#A3A3A8',line:'#6a6a70',v:mkv('24,24,27','#F2F2F2','#A3A3A8','225,6,0','.6','4px','inherit','none',{'--bi':'repeating-linear-gradient(45deg,rgba(255,255,255,.035) 0 2px,transparent 2px 4px)'})},
 glas:{acc:'#7DD3FC',o:.2,mut:'#D5E3EE',line:'#9fb4c4',v:mkv('210,230,255','#FFFFFF','#D5E3EE','255,255,255','2.2','16px','inherit','0 4px 24px rgba(0,0,0,.25)',{'--ts':'0 1px 3px rgba(0,0,0,.85)','--bf':'blur(12px)'})},
 retro:{acc:'#FFB000',o:.88,mut:'#A87400',line:'#7a5400',v:mkv('14,9,0','#FFB000','#A87400','255,176,0','.55','2px','ui-monospace,Consolas,monospace','none')},
 neon:{acc:'#00E5FF',o:.8,mut:'#7FA8C9',line:'#2a6f8a',v:mkv('5,8,22','#E6F7FF','#7FA8C9','0,229,255','.9','10px','inherit','0 0 14px rgba(0,229,255,.35)')},
 kontrast:{acc:'#FFFF00',o:1,mut:'#D6D6D6',line:'#bbbbbb',v:mkv('0,0,0','#FFFFFF','#D6D6D6','255,255,255','1','6px','inherit','none')}
};
let TH=THEMES[S.theme]||THEMES.standard;
const mkt=()=>{const o=mk();for(const k in o){o[k].c=TH.acc;o[k].o=TH.o}return o};
const save=()=>{try{localStorage.setItem('hudcfg2',JSON.stringify(S))}catch{}};
let edit=false,sel=null;const els={};
for(const k in NAMES){const d=document.createElement('div');d.className='p';d.dataset.k=k;d.style.width=W[k]+'px';$('#stage').append(d);els[k]=d}
els.inp.innerHTML='<div class="l">Pedale</div><canvas id="cv" width="300" height="90"></canvas><div class="bars"><i><u id="bt" style="background:#3DDC84"></u></i><i><u id="bb" style="background:#FF4D4D"></u></i></div>';
els.gf.innerHTML='<div class="l">G-Kräfte</div><div class="gf"><u id="gd"></u></div><div class="kv"><span>Quer / Längs</span><b id="gv"></b></div>';
els.map.innerHTML='<div class="l">Streckenkarte</div><canvas id="mc" width="300" height="240"></canvas>';
function layout(){for(const k in els){const c=cfg[k],e=els[k];e.style.left=c.x+'%';e.style.top=c.y+'%';e.style.transform=`scale(${c.s})`;e.style.setProperty('--c',c.c);e.style.setProperty('--o',c.o??TH.o);for(const q in TH.v)e.style.setProperty(q,TH.v[q]);e.style.display=(c.v||edit)?'':'none';e.style.opacity=c.v?1:.35;e.classList.toggle('sel',k===sel)}}
function ctl(){$('#ctl').style.display=sel?'block':'none';$('#dn').textContent=sel?NAMES[sel]:'Panel anklicken';if(sel){const c=cfg[sel];$('#sz').value=c.s;$('#op').value=1-(c.o??TH.o);$('#co').value=c.c;$('#vi').checked=!!c.v}}
function setEdit(v){edit=v;try{window.hudHost&&hudHost.editChanged(v)}catch{}document.body.classList.toggle('edit',v);$('#eb').textContent=v?'Fertig (E)':'Bearbeiten (E)';if(!v)sel=null;layout();ctl()}
$('#eb').onclick=()=>setEdit(!edit);addEventListener('keydown',e=>{if(e.key==='e'||e.key==='E')setEdit(!edit)});
$('#sz').oninput=e=>{cfg[sel].s=+e.target.value;layout();save()};
$('#op').oninput=e=>{cfg[sel].o=1-e.target.value;layout();save()};
$('#co').oninput=e=>{cfg[sel].c=e.target.value;layout();save()};
$('#vi').onchange=e=>{cfg[sel].v=e.target.checked?1:0;layout();save()};
$('#r1').onclick=()=>{cfg[sel]=structuredClone(DEF[sel]);cfg[sel].c=TH.acc;cfg[sel].o=TH.o;layout();ctl();save()};
$('#ra').onclick=()=>{cfg=S.p[S.active]=mkt();layout();ctl();save()};
$('#ov').onchange=e=>document.body.classList.toggle('overlay',e.target.checked);
$('#th').value=S.theme||'standard';
$('#th').onchange=e=>{S.theme=e.target.value;TH=THEMES[S.theme];for(const n in S.p)for(const k in S.p[n]){S.p[n][k].c=TH.acc;S.p[n][k].o=TH.o}layout();ctl();save()};
function prof(n){S.active=n;cfg=S.p[n];sel=null;$('#pf').value=n;layout();ctl();save()}
$('#pf').value=S.active;$('#pf').onchange=e=>prof(e.target.value);
$('#au').checked=!!S.auto;$('#au').onchange=e=>{S.auto=e.target.checked?1:0;save()};
$('#un').value=S.units;$('#un').onchange=e=>{S.units=e.target.value;save()};
$('#af').checked=!!S.autoFuel;$('#af').onchange=e=>{S.autoFuel=e.target.checked?1:0;save()};
$('#ir').checked=!!S.ir;$('#ir').onchange=e=>{S.ir=e.target.checked?1:0;save()};
$('#mi').checked=!!S.mirror;$('#mi').onchange=e=>{S.mirror=e.target.checked?1:0;save()};
$('#rm').onclick=()=>{delete maps[curTrack];rec=null;try{localStorage.setItem('hudmaps',JSON.stringify(maps))}catch{}};
let curTrack='',drag=null;
$('#stage').addEventListener('pointerdown',e=>{if(!edit)return;const p=e.target.closest('.p');if(!p)return;sel=p.dataset.k;const c=cfg[sel];drag={ox:e.clientX-c.x/100*innerWidth,oy:e.clientY-c.y/100*innerHeight};p.setPointerCapture(e.pointerId);layout();ctl()});
addEventListener('pointermove',e=>{if(!drag)return;const c=cfg[sel];c.x=Math.max(0,Math.min(98,(e.clientX-drag.ox)/innerWidth*100));c.y=Math.max(0,Math.min(98,(e.clientY-drag.oy)/innerHeight*100));layout()});
addEventListener('pointerup',()=>{if(drag){drag=null;save()}});

const fmt=s=>{if(!(s>0))return '–';const m=Math.floor(s/60);return m+':'+(s%60).toFixed(3).padStart(6,'0')};
const lab=t=>`<div class="l">${t}</div>`;
const kv=(a,b,c)=>`<div class="kv"><span>${a}</span><b${c?` style="color:${c}"`:''}>${b}</b></div>`;
const ik=v=>S.ir&&v?`<em>${v>=1000?(v/1000).toFixed(1)+'k':v}</em>`:'';
const rows=a=>a.map(r=>`<div class="r${r[3]?' me':''}"><b>${esc(r[0])}</b><span>${esc(r[1])}${ik(r[4])}</span><i>${esc(r[2])}</i></div>`).join('');
const tc=t=>t<85?'#5AB0FF':t<=100?G:t<=110?A:R;
function render(t){
 const U=S.units==='i'?{v:.621371,vu:'mph',f:.264172,fu:'gal',t:x=>x*9/5+32}:{v:1,vu:'km/h',f:1,fu:'L',t:x=>x};
 els.stand.innerHTML=lab('Platzierung')+rows(t.stand);
 els.rel.innerHTML=lab('Relative')+rows(t.rel);
 const n=20,lit=Math.round(Math.min(1,t.rpm/t.rpmMax)*n);let seg='';
 for(let i=0;i<n;i++)seg+=`<u style="background:${i<10?G:i<14?A:R};opacity:${i<lit?1:.22}"></u>`;
 els.rpm.innerHTML=`<div class="led">${seg}</div><div class="g3"><div><b>${Math.round(t.rpm)}</b><small>U/min</small></div><div class="gear">${t.gear>0?t.gear:t.gear<0?'R':'N'}</div><div style="text-align:right"><span class="sp">${Math.round(t.speed*U.v)}</span><small>${U.vu}</small></div></div>`;
 const d=t.delta||0;
 els.lap.innerHTML=lab('Delta zur besten Runde')+`<div class="delta" style="color:${d<=0?G:R}">${d<=0?'−':'+'}${Math.abs(d).toFixed(3)}</div>`+kv('Aktuell',fmt(t.cur))+kv('Letzte',fmt(t.last))+kv('Beste',fmt(t.best),G)+kv('Runde',t.lap+(t.laps>0?' / '+t.laps:''));
 els.tires.innerHTML=lab('Reifen · Temperatur')+'<div class="tg">'+t.tires.map((x,i)=>`<div class="t"><small>${['VL','VR','HL','HR'][i]}</small><b style="color:${tc(x.t)}">${Math.round(U.t(x.t))}°</b><small>Verschleiß ${Math.round(x.w)} %</small></div>`).join('')+`</div><div class="fu"><span class="l" style="margin:0">Sprit</span><span>${(t.fuel*U.f).toFixed(1)} ${U.fu}</span></div>`;
}
const maps=(()=>{try{return JSON.parse(localStorage.getItem('hudmaps'))||{}}catch{return{}}})();
maps.Demo=Array.from({length:400},(_,i)=>{const a=i/400*6.2832;return[Math.cos(a)*1.6+Math.cos(2*a)*.3,Math.sin(a)+Math.sin(3*a)*.15]});
let rec=null;
function mapStep(t){
 if(!t.track||maps[t.track]||t.speed<10)return;
 const now=Date.now();
 if(!rec||rec.tr!==t.track)rec={tr:t.track,p:Array(400).fill(null),n:0,x:0,y:0,at:now,b0:null};
 const dt=(now-rec.at)/1000;rec.at=now;
 rec.x+=t.speed/3.6*dt*Math.sin(t.yaw);rec.y+=t.speed/3.6*dt*Math.cos(t.yaw);
 const b=Math.floor(t.pct*400)%400;
 if(rec.b0===null)rec.b0=b;
 if(!rec.p[b]){rec.p[b]=[rec.x,rec.y];rec.n++}
 else if(rec.n>380&&b===rec.b0){
  const dx=rec.x-rec.p[rec.b0][0],dy=rec.y-rec.p[rec.b0][1],out=[];let last=rec.p[rec.b0];
  for(let k=0;k<400;k++){const i=(rec.b0+k)%400;last=rec.p[i]||last;out[i]=[last[0]-dx*k/400,last[1]-dy*k/400]}
  maps[t.track]=out;try{localStorage.setItem('hudmaps',JSON.stringify(maps))}catch{}rec=null}
}
function drawMap(t){
 const g=$('#mc').getContext('2d'),mp=maps[t.track];g.clearRect(0,0,300,240);
 if(!mp){g.fillStyle=TH.mut;g.font='14px sans-serif';g.fillText(rec?'Zeichne Karte … '+Math.round(rec.n/4)+' %':'Karte entsteht in der ersten Runde',12,120);return}
 const X=mp.map(q=>S.mirror?-q[0]:q[0]),Y=mp.map(q=>-q[1]),x0=Math.min(...X),x1=Math.max(...X),y0=Math.min(...Y),y1=Math.max(...Y),k=Math.min(276/((x1-x0)||1),216/((y1-y0)||1));
 const P=i=>[12+(276-(x1-x0)*k)/2+(X[i]-x0)*k,12+(216-(y1-y0)*k)/2+(Y[i]-y0)*k];
 g.strokeStyle=TH.line;g.lineWidth=5;g.lineJoin='round';g.beginPath();
 for(let i=0;i<400;i++){const q=P(i);i?g.lineTo(q[0],q[1]):g.moveTo(q[0],q[1])}g.closePath();g.stroke();
 const dot=(c,r,col)=>{const q=P(Math.floor(c[0]*400)%400);g.fillStyle=col;g.beginPath();g.arc(q[0],q[1],r,0,7);g.fill()};
 (t.cars||[]).filter(c=>!c[1]).forEach(c=>dot(c,4,c[3]?'#666':c[2]));
 (t.cars||[]).filter(c=>c[1]).forEach(c=>dot(c,7,cfg.map.c));
}
function drawAlert(t){
 const a=t.alerts||[];
 els.ovt.innerHTML=lab('Overtake-Alert')+(a.length?a.slice(0,2).map(x=>`<div class="fl${x.gap<3?' bl':''}" style="background:${esc(x.color)};font-size:18px;margin-top:4px">▲ ${esc(x.name)} ${esc(x.num)} · ${x.gap.toFixed(1)} s</div>`).join(''):'<div style="color:var(--mut);font-size:16px;padding:6px 0">Kein schnelleres Auto in der Nähe</div>');
}
let lastCalc=null,fmsg='',wasPit=false;
function fuelCalc(t){
 const avg=uses.length?uses.reduce((x,y)=>x+y)/uses.length:0,lt=t.last>0?t.last:(t.best>0?t.best:0);
 let rest=null;
 if(t.laps>0)rest=t.laps-t.lap+1;else if(t.timeRemain>0&&lt)rest=Math.ceil(t.timeRemain/lt)+1;
 const tot=rest===null?null:rest+(S.extra||0);
 let add=tot!==null&&avg?Math.max(0,tot*avg-t.fuel):null;
 if(add!==null&&t.fuelMax)add=Math.min(add,Math.max(0,t.fuelMax-t.fuel));
 return{avg,add}
}
function flash(m){fmsg=m;setTimeout(()=>{fmsg=''},4000)}
function xl(d){S.extra=Math.max(0,Math.min(20,(S.extra||0)+d));save()}
function sendFuel(){
 if(!lastCalc||lastCalc.add===null){flash('Noch keine Berechnung möglich');return}
 if(!ws||ws.readyState!==1){flash('Keine Verbindung zu iRacing');return}
 ws.send(JSON.stringify({cmd:'fuel',l:lastCalc.add}));
 flash(lastCalc.add>0?'Boxenstopp: +'+Math.ceil(lastCalc.add)+' L gesendet':'Tanken abgewählt')
}
const hist=[];let lf=null,lastLap=null,uses=[];
function extra(t){
 curTrack=t.track||'';mapStep(t);drawMap(t);drawAlert(t);
 const U=S.units==='i'?{f:.264172,fu:'gal'}:{f:1,fu:'L'};
 const f=t.flags??4;let fl=['–','#555'];
 if(f&0x10)fl=['Rot','#FF4D4D'];else if(f&1)fl=['Ziel','#fff'];else if(f&0xC108)fl=['Gelb','#FFD400'];else if(f&0x20)fl=['Blau','#4DA3FF'];else if(f&2)fl=['Weiß','#fff'];else if(f&0x404)fl=['Grün',G];
 els.flag.innerHTML=`<div class="fl" style="background:${fl[1]}">${fl[0]}</div>`;
 const gp=t.gaps||{},gl=(n,x)=>kv(n+(x?' · '+esc(x[0]):''),x?x[1].toFixed(1)+' s':'–');
 els.gap.innerHTML=lab('Abstand (eigene Klasse)')+gl('Vorne',gp.a)+gl('Hinten',gp.b);
